<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Pedra papel e tesoura</title>
</head>

<body>
   <header class="introducao">
    <img src="./images/logogame.png" alt="logo">
    <div class="placar">
        <h2 class="score">Pontos</h2>
        <p class="pontuacao">0</p>
    </div>
   </header>
   <main class="jogo">

<div class="conteiner conteiner-pedra">
    <button value="pedra" class="pedra opcao" onclick="jogar('pedra')">
        <img src="images/icon-rock.svg" alt="">
    </button>
</div>

<div class="conteiner conteiner-papel">
    <button value="papel" class="papel opcao" onclick="jogar('papel')">
        <img src="images/icon-paper.svg" alt="">
    </button>
</div>

<div class="conteiner conteiner-tesoura">
    <button value="tesoura" class="tesoura opcao" onclick="jogar('tesoura')">
        <img src="images/icon-scissors.svg" alt="">
    </button>
</div>

<div class="conteiner conteiner-lagarto">
    <button value="lagarto" class="lagarto opcao" onclick="jogar('lagarto')">
        <img src="images/lagarto.png" alt="">
    </button>
</div>

<div class="conteiner conteiner-spock">
    <button value="spock" class="spock opcao" onclick="jogar('spock')">
        <img src="images/spokhand.webp" alt="">
    </button>
</div>

</main>
   <!--regras-->
   <div id="regra" class="regras">
    <div class="regras-titulo">
        <h1>Regras</h1>
        <button onclick="fecharregras()">
            <img src="images/icon-close.svg" alt=""></button>
        </div>
    <img src="images/regras.jpg" alt="">
   </div>
   <!--gameplay-->
   <div class="gameplay">
    <div class = "player display">
        <h2 class="persona">Você Escolheu</h2>
        <p class="test"></p>
    </div>
    <div class="fim">
        <p class="result"></p>
            <button class="playAgain" onclick="reset()">Jogar Novamente</button>
        
    </div>
    <div class="houese display">
        <h2 class="persona">O computador Escolheu</h2>
        <p class="test1"></p>
    </div>
   </div>
   <button class="regras-button" onclick="mostrarregras()">Regras</button>
    <script src="script.js"></script>
</body>

</html>
